# Release manual: builda macOS (arm64 + Intel), Windows e Linux e publica os
# instaladores numa Release do GitHub com a tag informada.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da release (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version }}
          releaseName: "SSHDeck ${{ inputs.version }}"
          releaseBody: |
            Instaladores para macOS (Apple Silicon e Intel), Windows e Linux.

            > ⚠️ **macOS:** o app não é assinado (sem conta de desenvolvedor). Se aparecer
            > "app danificado" ou o Gatekeeper bloquear, rode uma vez no Terminal:
            > ```
            > xattr -dr com.apple.quarantine /Applications/SSHDeck.app
            > ```

            Veja o README para instruções completas de instalação.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
