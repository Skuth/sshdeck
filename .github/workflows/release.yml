# Release manual com versionamento automático:
# 1. job "version" roda scripts/bump.mjs (patch/minor/major), atualiza CHANGELOG.md,
#    commita, tagueia e faz push.
# 2. job "build" compila macOS (arm64 + Intel), Windows e Linux na tag nova e
#    publica os instaladores numa Release com o changelog como corpo.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de bump de versão"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      notes: ${{ steps.bump.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: bump
        run: |
          # o checkout do dispatch pode vir defasado — garante a main mais recente
          git pull --ff-only origin main
          VERSION=$(node scripts/bump.mjs ${{ inputs.bump }})
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "Chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main --tags
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            cat .release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "SSHDeck ${{ needs.version.outputs.tag }}"
          releaseBody: |
            ${{ needs.version.outputs.notes }}

            ---

            > ⚠️ **macOS:** o app não é assinado (sem conta de desenvolvedor). Se aparecer
            > "app danificado" ou o Gatekeeper bloquear, rode uma vez no Terminal:
            > ```
            > xattr -dr com.apple.quarantine /Applications/SSHDeck.app
            > ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
