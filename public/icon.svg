<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151a26"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57d9a3"/>
      <stop offset="100%" stop-color="#2eb98a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#57d9a3" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#2a3242" stroke-width="8"/>

  <!-- barra de janela de terminal -->
  <rect x="176" y="216" width="672" height="592" rx="64" fill="#0b0e14" stroke="#232a38" stroke-width="6"/>
  <circle cx="264" cy="300" r="18" fill="#f2778c"/>
  <circle cx="324" cy="300" r="18" fill="#e8c26e"/>
  <circle cx="384" cy="300" r="18" fill="#57d9a3"/>
  <line x1="176" y1="360" x2="848" y2="360" stroke="#232a38" stroke-width="6"/>

  <!-- prompt >_ -->
  <g filter="url(#soft)">
    <path d="M 300 460 L 448 584 L 300 708" fill="none" stroke="url(#glow)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="500" y="680" width="212" height="56" rx="28" fill="url(#glow)"/>
  </g>
</svg>
