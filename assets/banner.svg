<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10141f"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57d9a3"/>
      <stop offset="100%" stop-color="#2eb98a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.28" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#57d9a3" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#57d9a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#57d9a3" flood-opacity="0.35"/>
    </filter>
    <filter id="winshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="16" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#232a38"/>

  <!-- grade sutil -->
  <g stroke="#ffffff" stroke-opacity="0.02">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200"/>
    <path d="M300 0 V420 M600 0 V420 M900 0 V420"/>
  </g>

  <!-- ícone -->
  <g transform="translate(80,120)">
    <rect width="180" height="180" rx="42" fill="#0b0e14" stroke="#2a3242" stroke-width="2.5"/>
    <circle cx="38" cy="36" r="6" fill="#f2778c"/>
    <circle cx="60" cy="36" r="6" fill="#e8c26e"/>
    <circle cx="82" cy="36" r="6" fill="#57d9a3"/>
    <line x1="0" y1="58" x2="180" y2="58" stroke="#232a38" stroke-width="2.5"/>
    <g filter="url(#soft)">
      <path d="M 40 88 L 76 118 L 40 148" fill="none" stroke="url(#glow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="136" width="52" height="14" rx="7" fill="url(#glow)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="310" y="192" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#f0f2f8">SSH<tspan fill="#57d9a3">Deck</tspan></text>
  <text x="312" y="234" font-size="21" fill="#8a93a8">Cliente SSH rápido, bonito e criptografado.</text>

  <!-- chips de features -->
  <g font-size="14" font-weight="600">
    <rect x="312" y="262" width="132" height="32" rx="16" fill="#57d9a31a" stroke="#57d9a355"/>
    <text x="378" y="283" text-anchor="middle" fill="#57d9a3">🔐 Vault AES-256</text>
    <rect x="454" y="262" width="118" height="32" rx="16" fill="#6ea8f71a" stroke="#6ea8f755"/>
    <text x="513" y="283" text-anchor="middle" fill="#6ea8f7">🗂️ Abas + SFTP</text>
    <rect x="582" y="262" width="176" height="32" rx="16" fill="#c795f01a" stroke="#c795f055"/>
    <text x="670" y="283" text-anchor="middle" fill="#c795f0">⚡ 2 clicks e conectou</text>
  </g>

  <!-- mock do app -->
  <g transform="translate(770,64)" filter="url(#winshadow)">
    <rect width="370" height="292" rx="14" fill="#0e1118" stroke="#232a38" stroke-width="1.5"/>
    <!-- traffic lights -->
    <circle cx="20" cy="18" r="5" fill="#f2778c"/>
    <circle cx="38" cy="18" r="5" fill="#e8c26e"/>
    <circle cx="56" cy="18" r="5" fill="#57d9a3"/>
    <line x1="0" y1="34" x2="370" y2="34" stroke="#232a38" stroke-width="1.5"/>

    <!-- sidebar -->
    <rect x="0" y="34" width="120" height="258" fill="#0b0e14"/>
    <line x1="120" y1="34" x2="120" y2="292" stroke="#232a38" stroke-width="1.5"/>
    <!-- grupo databases -->
    <circle cx="16" cy="56" r="3.5" fill="#6ea8f7"/>
    <rect x="26" y="52" width="58" height="8" rx="4" fill="#6ea8f7" opacity="0.85"/>
    <g>
      <rect x="10" y="68" width="100" height="24" rx="6" fill="#6ea8f7" opacity="0.12"/>
      <rect x="16" y="74" width="12" height="12" rx="3" fill="#6ea8f7" opacity="0.5"/>
      <rect x="34" y="76" width="52" height="7" rx="3.5" fill="#d6dae4" opacity="0.75"/>
      <circle cx="102" cy="80" r="3" fill="#57d9a3"/>
    </g>
    <g>
      <rect x="16" y="102" width="12" height="12" rx="3" fill="#6ea8f7" opacity="0.35"/>
      <rect x="34" y="104" width="44" height="7" rx="3.5" fill="#8a93a8" opacity="0.6"/>
    </g>
    <!-- grupo apis -->
    <circle cx="16" cy="136" r="3.5" fill="#57d9a3"/>
    <rect x="26" y="132" width="36" height="8" rx="4" fill="#57d9a3" opacity="0.85"/>
    <g>
      <rect x="16" y="148" width="12" height="12" rx="3" fill="#57d9a3" opacity="0.35"/>
      <rect x="34" y="150" width="56" height="7" rx="3.5" fill="#8a93a8" opacity="0.6"/>
    </g>
    <g>
      <rect x="16" y="168" width="12" height="12" rx="3" fill="#57d9a3" opacity="0.35"/>
      <rect x="34" y="170" width="40" height="7" rx="3.5" fill="#8a93a8" opacity="0.6"/>
    </g>
    <!-- grupo fronts -->
    <circle cx="16" cy="200" r="3.5" fill="#e8c26e"/>
    <rect x="26" y="196" width="44" height="8" rx="4" fill="#e8c26e" opacity="0.85"/>
    <g>
      <rect x="16" y="212" width="12" height="12" rx="3" fill="#e8c26e" opacity="0.35"/>
      <rect x="34" y="214" width="50" height="7" rx="3.5" fill="#8a93a8" opacity="0.6"/>
    </g>

    <!-- abas -->
    <rect x="121" y="34" width="86" height="26" fill="#0b0e14"/>
    <circle cx="134" cy="47" r="3" fill="#57d9a3"/>
    <rect x="142" y="43" width="42" height="8" rx="4" fill="#d6dae4" opacity="0.8"/>
    <line x1="207" y1="34" x2="207" y2="60" stroke="#232a38"/>
    <circle cx="220" cy="47" r="3" fill="#e8c26e"/>
    <rect x="228" y="43" width="36" height="8" rx="4" fill="#8a93a8" opacity="0.5"/>
    <line x1="121" y1="60" x2="370" y2="60" stroke="#232a38" stroke-width="1.5"/>

    <!-- terminal -->
    <g font-family="Menlo, monospace" font-size="10">
      <text x="134" y="84" fill="#57d9a3">deploy@prod-01:~$ <tspan fill="#d6dae4">uptime</tspan></text>
      <text x="134" y="102" fill="#8a93a8">14:32:08 up 212 days,  load: 0.42</text>
      <text x="134" y="120" fill="#57d9a3">deploy@prod-01:~$ <tspan fill="#d6dae4">df -h /</tspan></text>
      <text x="134" y="138" fill="#8a93a8">/dev/vda1   120G   61G   54G  53% /</text>
      <text x="134" y="156" fill="#57d9a3">deploy@prod-01:~$</text>
      <rect x="238" y="147" width="7" height="12" fill="#57d9a3">
        <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- barra sftp -->
    <rect x="121" y="266" width="249" height="26" fill="#0b0e14"/>
    <line x1="121" y1="266" x2="370" y2="266" stroke="#232a38" stroke-width="1.5"/>
    <rect x="134" y="274" width="90" height="9" rx="4.5" fill="#232a38"/>
    <rect x="134" y="274" width="58" height="9" rx="4.5" fill="url(#glow)"/>
    <text x="234" y="283" font-size="9" fill="#8a93a8" font-family="Menlo, monospace">backup.tar.gz 64%</text>
  </g>
</svg>
